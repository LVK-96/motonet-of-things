name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:

jobs:
  host:
    name: Host Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Host verification
        run: just test-host

  firmware:
    name: Firmware Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install ESP toolchain
        uses: esp-rs/xtensa-toolchain@v1
        with:
          default: true
          ldproxy: false

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Firmware verification
        run: just check-firmware
