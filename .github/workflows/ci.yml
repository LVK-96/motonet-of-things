name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  host:
    name: Host Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Core crates clippy
        run: cargo +stable clippy -p app-core -p telemetry-core --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Core crates tests
        run: cargo +stable test -p app-core -p telemetry-core --target x86_64-unknown-linux-gnu

      - name: Host verification bundle
        run: just host-test

  firmware:
    name: Firmware Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Firmware verification
        run: just esp-check
