name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:

jobs:
  host:
    name: Host Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy (host crates)
        run: cargo clippy -p rubicson -p eu-dst -p karu-menu --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Tests (host crates)
        run: cargo test -p rubicson -p eu-dst -p karu-menu --target x86_64-unknown-linux-gnu

  firmware:
    name: Firmware Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install ESP toolchain
        uses: esp-rs/xtensa-toolchain@v1
        with:
          default: true
          ldproxy: false

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Prepare local secrets
        run: cp firmware/src/secrets.rs.example firmware/src/secrets.rs

      - name: Firmware cargo check
        working-directory: firmware
        run: cargo check
