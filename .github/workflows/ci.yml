name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:

jobs:
  host:
    name: Host Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Core crates clippy
        run: cargo clippy -p app-core -p telemetry-core --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Core crates tests
        run: cargo test -p app-core -p telemetry-core --target x86_64-unknown-linux-gnu

      - name: Host verification bundle
        run: just test-host

  firmware:
    name: Firmware Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install ESP toolchain
        run: |
          cargo install espup --locked
          espup install --targets esp32 --std

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Firmware verification
        run: |
          source "$HOME/export-esp.sh"
          just check-firmware
