[package]
edition = "2024"
name = "esp32-rust-project"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "esp32-rust-project"
path = "./src/bin/main.rs"
test = false

[lib]
test = false
doctest = false

[dependencies]
defmt = "1.0.1"
esp-hal = { version = "~1.0", features = ["defmt", "esp32", "unstable"] }
esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp32",
  "esp-radio",
] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32"] }
embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-println = { version = "0.16.1", features = ["esp32", "defmt-espflash"] }
esp-radio = { version = "0.17.0", features = [
  "esp32",
  "ble",
  "defmt",
  "unstable",
] }
trouble-host = { version = "0.5.1", features = ["defmt", "peripheral"] }
bt-hci = { version = "0.6.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-futures = { version = "0.1.1" }
critical-section = "1.2.0"
static_cell = "2.1.1"
embedded-hal = "1.0"
embedded-hal-bus = { version = "0.3.0", features = ["defmt-03"] }
cc1101 = { git = "https://github.com/dsvensson/cc1101.git", branch = "main" }
rubicson = { path = "../crates/rubicson", features = ["defmt"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
