[package]
edition = "2024"
name = "esp32-rust-project"
rust-version = "1.95"
version = "0.1.0"

[[bin]]
name = "esp32-rust-project"
path = "./src/bin/main.rs"
test = false

[lib]
test = false
doctest = false

[features]
default = ["pulse_rmt"]
pulse_sw = []
pulse_rmt = []
ota-rollback-test = []
release-ota = []

[dependencies]
rubicson = { path = "../crates/rubicson" }
eu-dst = { path = "../crates/eu-dst" }
karu-menu = { path = "../crates/karu-menu" }
app-core = { path = "../crates/app-core" }
ota-core = { path = "../crates/ota-core" }
telemetry-core = { path = "../crates/telemetry-core" }

defmt = "1.1.0"
esp-hal = { version = "~1.1", features = ["defmt", "esp32", "unstable"] }
esp-rtos = { version = "0.3.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp32",
  "esp-radio",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32"] }
esp-storage = { version = "0.9", features = ["esp32", "defmt"] }
embedded-storage = "0.3"
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime-ms"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "udp", "dhcpv4", "dns", "medium-ethernet"] }
esp-alloc = { version = "0.10.0", features = ["defmt"] }
esp-println = { version = "0.17.0", features = ["esp32", "defmt-espflash"] }
nb = "1.1"
esp-radio = { version = "0.18.0", features = [
  "esp32",
  "wifi",
  "defmt",
  "unstable",
] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
critical-section = "1.2.0"
static_cell = "2.1.1"
embedded-hal = "1.0"
embedded-hal-bus = { version = "0.3.0", features = ["defmt-03"] }
embedded-io-async = "0.7.0"
cc1101 = { git = "https://github.com/dsvensson/cc1101.git", branch = "main" }
rust-mqtt = { version = "0.5", default-features = false, features = ["defmt", "v5", "bump"] }
embedded-tls = { version = "0.19.0", default-features = false, features = ["alloc", "defmt", "p384", "rustpki"] }
reqwless = { path = "../tools/reqwless", default-features = false, features = ["alloc", "defmt", "embedded-tls"] }
sha2 = { version = "0.10", default-features = false }
embedded-nal-async = "0.9.0"
rand_core = { version = "0.6.4", default-features = false }
der = { version = "0.8.0", default-features = false, features = ["heapless"] }
heapless = "0.9.3"
xtensa-lx = "0.13.0"

# Display
mini-oled = "0.1"
embedded-graphics = "0.8"
profont = "0.7"

# Time sync
sntpc = { version = "0.10", default-features = false }
sntpc-net-embassy = "0.10"
esp32 = "0.40.2"

[lints]
workspace = true
