[build]
# Firmware crate default target/toolchain configuration.
target = "xtensa-esp32-none-elf"
rustflags = ["-C", "link-arg=-nostartfiles"]

[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor --log-format defmt --partition-table partitions.csv"

[unstable]
build-std = ["core", "alloc"]

[env]
# Production-friendly default. Override per run for development:
# DEFMT_LOG=info|debug|trace cargo run --release
DEFMT_LOG = "info"
