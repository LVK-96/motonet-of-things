[package]
name = "ota-core"
version = "0.1.0"
edition = "2024"
description = "Host-testable OTA manifest canonicalization and validation core"

[features]
default = []
dev-ota = []
release-ota = []

[dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "fast"] }
heapless = "0.9"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[lints]
workspace = true
